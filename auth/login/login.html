</head>
<body>

  <a href="../../index.html" class="brand">
    <img src="../../shared/img/logo-icon.svg" alt="LOC RÉACTION S.A.S" class="brand-icon">
    <span class="brand-text">
      <span class="brand-name">LOC <span>RÉACTION</span></span>
      <span class="brand-sub">TRANSPORT DE PASSAGERS | SERVICE VTC</span>
    </span>
  </a>

    <a href="../../index.html#services" data-i18n="nav_services"></a>

    <a href="../../contact.html" data-i18n="nav_contact"></a>
  </div>
  <div class="nav-right">
    <select id="lang-select-desktop" class="lang-select" aria-label="Langue"></select>
    <button class="hamburger" id="hamburger-btn" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="mobile-menu" id="mobile-menu">
  <a href="../../index.html">Accueil</a>
  <a href="../../index.html#services" data-i18n="nav_services"></a>

  <select id="lang-select-mobile" class="lang-select" aria-label="Langue"></select>
</div>
<div class="menu-backdrop"></div>


<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title" data-i18n="title"></h1>
    <p class="auth-subtitle" data-i18n="subtitle"></p>

    <div class="role-tabs" id="role-tabs">
      <button class="role-tab active" data-role="client" onclick="selectRole('client', this)"><i class="fas fa-user"></i><span data-i18n="tab_client"></span></button>
      <button class="role-tab" data-role="chauffeur" onclick="selectRole('chauffeur', this)"><i class="fas fa-car"></i><span data-i18n="tab_chauffeur"></span></button>
      <button class="role-tab" data-role="admin" onclick="selectRole('admin', this)"><i class="fas fa-shield-alt"></i><span data-i18n="tab_admin"></span></button>
    </div>

    <div id="login-alert" class="auth-alert"></div>

    <div class="auth-form-group">
      <label data-i18n="f_email"></label>
      <div class="auth-input-wrap">
        <i class="fas fa-envelope left-icon"></i>
        <input type="email" id="l-email" class="auth-input">
      </div>
    </div>
    <div class="auth-form-group">
      <label data-i18n="f_password"></label>
      <div class="auth-input-wrap">
        <i class="fas fa-lock left-icon"></i>
        <input type="password" id="l-password" class="auth-input" style="padding-right:42px">
        <button type="button" class="auth-toggle-pw" onclick="togglePw('l-password', this)"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <a href="../forgot-password/forgot-password.html" class="auth-forgot" data-i18n="forgot"></a>

    <button class="btn btn-primary auth-submit" id="login-btn" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> <span data-i18n="submit"></span></button>

    <div class="auth-divider">ou</div>
    <div class="auth-switch">
      <span data-i18n="no_account"></span> <a href="../register/register.html" data-i18n="create_account"></a>
    </div>
  </div>
</div>


<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <div class="footer-brand">⚡ LOC <span>RÉACTION</span> S.A.S</div>
      <div style="font-size:.85rem;margin-top:10px">Île-de-France</div>
      <div style="font-size:.85rem">95270 Chaumontel</div>
    </div>
    <div class="footer-links">
      <a href="../devis.html" data-i18n="footer_devis"></a>
      <a href="../mentions-legales.html" data-i18n="footer_legal_link"></a>
    </div>
  </div>
  <div class="footer-bottom">© 2026 LOC RÉACTION S.A.S — <span data-i18n="footer_legal"></span></div>
</footer>

<script type="module" src="login.js"></script>
</body>
</html>
