<body>

    <img src="../../shared/img/logo-icon.svg" alt="LOC RÉACTION S.A.S" class="brand-icon">

    </span>

  <div class="nav-right">
    <select id="lang-select-desktop" class="lang-select" aria-label="Langue"></select>
    <button class="hamburger" id="hamburger-btn" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>

<div class="mobile-menu" id="mobile-menu">

</div>
<div class="menu-backdrop"></div>


<div class="auth-wrap">
  <div class="auth-card">
    <div id="reset-valid-block">
      <h1 class="auth-title" data-i18n="title"></h1>
      <p class="auth-subtitle" data-i18n="subtitle"></p>

      <div id="reset-alert" class="auth-alert"></div>

      <div id="reset-form">
        <div class="auth-form-group">
          <label data-i18n="f_password"></label>
          <div class="auth-input-wrap">
            <i class="fas fa-lock left-icon"></i>
            <input type="password" id="rp-password" class="auth-input" style="padding-right:42px">
            <button type="button" class="auth-toggle-pw" onclick="togglePw('rp-password', this)"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="auth-form-group">
          <label data-i18n="f_password_confirm"></label>
          <div class="auth-input-wrap"><i class="fas fa-lock left-icon"></i><input type="password" id="rp-password-confirm" class="auth-input"></div>
        </div>
        <button class="btn btn-primary auth-submit" id="reset-btn" onclick="doReset()"><i class="fas fa-check"></i> <span data-i18n="submit"></span></button>
      </div>
    </div>

    <div id="reset-invalid-block" style="display:none; text-align:center">
      <div style="font-size:2.4rem;color:var(--red);margin-bottom:14px"><i class="fas fa-exclamation-triangle"></i></div>
      <h1 class="auth-title" data-i18n="invalid_title"></h1>
      <p class="auth-subtitle" data-i18n="invalid_text"></p>
      <a href="../forgot-password/forgot-password.html" class="btn btn-primary auth-submit" style="text-decoration:none"><i class="fas fa-redo"></i> <span data-i18n="request_new_link"></span></a>
      <div class="auth-switch" style="margin-top:16px"><a href="../login/login.html" data-i18n="go_to_login"></a></div>
    </div>
  </div>
</div>


<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <div class="footer-brand">⚡ LOC <span>RÉACTION</span> S.A.S</div>
      <div style="font-size:.85rem;margin-top:10px">Île-de-France</div>
      <div style="font-size:.85rem">95270 Chaumontel</div>
    </div>
    <div class="footer-links">
      <a href="../devis.html" data-i18n="footer_devis"></a>
      <a href="../mentions-legales.html" data-i18n="footer_legal_link"></a>
    </div>
  </div>
  <div class="footer-bottom">© 2026 LOC RÉACTION S.A.S — <span data-i18n="footer_legal"></span></div>
</footer>

<script type="module" src="reset-password.js"></script>
</body>
</html>
