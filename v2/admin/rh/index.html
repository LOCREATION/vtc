<!doctype html>
<!-- =============================================================================
     LOC RÉACTION S.A.S — Version 2
     Administration : RH et paie
     Une seule page, cinq onglets (choisis par l'adresse) :
       - Salariés (par défaut) : fiches, dossier, reprise d'une paie faite
         ailleurs, contrats de travail ;
       - Bulletins (?vue=bulletins) : bulletins d'un mois, préparation avec
         aperçu calculé par la base, validation, remise, export ;
       - Congés et absences (?vue=absences) : demandes, soldes, saisie ;
       - Temps de travail (?vue=temps) : heures de la semaine, heures
         supplémentaires et complémentaires ;
       - Paramètres de paie (?vue=parametres) : taux de l'année, validation
         par l'expert-comptable.
     Pages sans onglet : dossier d'un salarié (?salarie=…), contrat
     imprimable (?contrat=…), bulletin imprimable (?bulletin=…),
     préparation d'un bulletin (?preparer=…&periode=…).
     ============================================================================= -->
