<!doctype html>
<!-- =============================================================================
     LOC RÉACTION S.A.S — Version 2
     Administration : clients et entreprises
     Une seule page, plusieurs vues (choisies par l'adresse) :
       - liste des clients (par défaut) ou des entreprises (?vue=entreprises) ;
       - fiche d'un client (?id=…) : identité, chiffres, courses, factures,
         solde, notes des chauffeurs, parrainage, blocage, notes internes,
         historique ;
       - fiche d'une entreprise (?entreprise=…) : identité, membres, relevé
         mensuel et encaissement, courses, notes internes, historique ;
       - relevé imprimable d'une entreprise (?entreprise=…&releve=AAAA-MM).
     ============================================================================= -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clients et entreprises, administration LOC RÉACTION</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A1A38">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../commun/img/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../commun/img/icone-192.png">
  <link rel="stylesheet" href="../../commun/styles.css">
  <link rel="stylesheet" href="../commun/admin.css">
  <link rel="stylesheet" href="clients.css">
  <script type="module" src="clients.js"></script>
</head>

      <header class="admin-entete">

      <main class="admin-page" id="admin-page">
        <div class="onglets" role="tablist" aria-label="Rubriques" id="onglets" hidden></div>
        <div class="contenu-clients" id="contenu"><p class="chargement">Chargement…</p></div>

    </div>
