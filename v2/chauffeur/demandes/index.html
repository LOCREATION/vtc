<!doctype html>
<!-- =============================================================================
     LOC RÉACTION S.A.S — Version 2
     Espace chauffeur : adresse « /chauffeur/demandes/?id=… »
     Lien des notifications du support (« Réponse du support », « Demande
     résolue », « Demande enregistrée ») : renvoie à l'espace chauffeur, qui
     ouvre la demande dans « Mes demandes au support » (?demande=…).
     ============================================================================= -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mes demandes au support, espace chauffeur LOC RÉACTION</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A1A38">
  <link rel="icon" href="../../commun/img/icone.svg" type="image/svg+xml">
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get('id');
      var valide = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id || '');
      location.replace('../' + (valide ? '?demande=' + encodeURIComponent(id) : '?onglet=compte#compte-bloc-support'));
    })();
  </script>
</head>
<body>
  <p><a href="../?onglet=compte#compte-bloc-support">Ouvrir mes demandes au support</a></p>
</body>
</html>
